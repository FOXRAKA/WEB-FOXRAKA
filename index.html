<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOXRAKA HUB - Script Host</title>
    <style>
        :root {
            --bg-color: #0f1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-color: #2ea043;
            --accent-hover: #3fb950;
            --danger-color: #da3633;
            --code-bg: #0d1117;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 700;
            font-size: 1.2rem;
            color: #fff;
            letter-spacing: 1px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            margin: 32px auto;
            padding: 0 16px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 10px;
            background-color: var(--code-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        textarea {
            font-family: monospace;
            height: 180px;
            resize: vertical;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .btn {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: #21262d;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .script-item {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 16px;
            background-color: var(--code-bg);
        }

        .script-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .script-title {
            font-weight: 600;
            color: #58a6ff;
        }

        .badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .badge-public { color: #3fb950; border-color: #238636; }
        .badge-private { color: #f85149; border-color: #da3633; }

        .output-box {
            background-color: #010409;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #7ee787;
            word-break: break-all;
            margin-top: 8px;
        }

        .toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #2ea043;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 12px;
            position: fixed;
            z-index: 2000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
        }

        .toast.show { visibility: visible; opacity: 1; }
    </style>
</head>
<body>

    <div id="mainUI">
        <header>
            <div class="logo">FOXRAKA HUB</div>
        </header>

        <div class="container">
            <div class="card">
                <h2 style="margin-bottom: 16px; font-size: 1.1rem;">Buat Raw Script FOXRAKA HUB</h2>
                
                <div class="input-row">
                    <div class="form-group">
                        <label>Username (Bebas)</label>
                        <input type="text" id="inputUser" placeholder="Contoh: Foxraka">
                    </div>
                    <div class="form-group">
                        <label>Nama Repo / Menu (Bebas)</label>
                        <input type="text" id="inputRepo" placeholder="Contoh: ScriptHub">
                    </div>
                </div>

                <div class="form-group">
                    <label>Status Visibilitas</label>
                    <select id="inputVisibility">
                        <option value="public">Public (Kelihatan di Browser & Bisa Exec)</option>
                        <option value="private">Private (Pesan Khusus di Browser, Tetap Bisa Exec)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Isi Kode Script Lua</label>
                    <textarea id="inputCode" placeholder="print('FOXRAKA HUB Active!')"></textarea>
                </div>

                <button class="btn" onclick="saveScript()">Simpan & Buat Loadstring</button>
            </div>

            <div class="card">
                <h2 style="margin-bottom: 16px; font-size: 1.1rem;">Daftar Raw Script FOXRAKA HUB</h2>
                <div id="scriptList"></div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Copy loadstring berhasil!</div>

    <script>
        let scripts = JSON.parse(localStorage.getItem('foxrakahub_final_scripts')) || [];

        function handleRawRoute() {
            const hashPath = window.location.hash;
            if (hashPath.startsWith('#/raw/')) {
                const parts = hashPath.replace('#/raw/', '').split('/');
                const scriptId = parts[2];
                const foundScript = scripts.find(s => s.hash === scriptId);

                document.getElementById('mainUI').style.display = 'none';
                document.body.style.backgroundColor = '#0d1117';
                document.body.style.color = '#c9d1d9';
                document.body.style.fontFamily = 'monospace';
                document.body.style.padding = '20px';
                document.body.style.whiteSpace = 'pre-wrap';
                document.body.style.wordBreak = 'break-all';

                if (!foundScript) {
                    document.body.innerText = "-- 404: Script tidak ditemukan di FOXRAKA HUB";
                    return;
                }

                if (foundScript.visibility === 'private') {
                    document.body.innerText = "Link ini diprivat karena owner tidak mengizinkan siapa pun melihat isi nya";
                } else {
                    document.body.innerText = foundScript.code;
                }
            }
        }

        function generateHash() {
            return Math.random().toString(36).substring(2, 8);
        }

        function saveScript() {
            const user = document.getElementById('inputUser').value.trim() || 'FOXRAKAHUB';
            const repo = document.getElementById('inputRepo').value.trim().replace(/\s+/g, '-') || 'Main';
            const visibility = document.getElementById('inputVisibility').value;
            const code = document.getElementById('inputCode').value;

            if (!code) {
                alert("Isi kode Lua script tidak boleh kosong!");
                return;
            }

            const hash = generateHash();
            const baseUrl = window.location.href.split('#')[0];
            const rawUrl = `${baseUrl}#/raw/${user}/${repo}/${hash}`;

            const newScript = {
                id: Date.now(),
                user, repo, hash, visibility, code, rawUrl
            };

            scripts.unshift(newScript);
            localStorage.setItem('foxrakahub_final_scripts', JSON.stringify(scripts));
            
            document.getElementById('inputCode').value = '';
            renderScripts();
            showToast("Script berhasil disimpan!");
        }

        function renderScripts() {
            const list = document.getElementById('scriptList');
            if (scripts.length === 0) {
                list.innerHTML = '<p style="color: var(--text-muted);">Belum ada script di FOXRAKA HUB.</p>';
                return;
            }

            list.innerHTML = scripts.map(s => {
                const loadstringCmd = `loadstring(game:HttpGet("${s.rawUrl}"))()`;
                const isPrivate = s.visibility === 'private';

                return `
                    <div class="script-item">
                        <div class="script-header">
                            <span class="script-title">${s.user} / ${s.repo}</span>
                            <span class="badge ${isPrivate ? 'badge-private' : 'badge-public'}">
                                ${isPrivate ? 'Private' : 'Public'}
                            </span>
                        </div>
                        <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px;">
                            FOXRAKA HUB ID: ${s.hash}
                        </div>
                        <div class="output-box" id="code-${s.id}">${loadstringCmd}</div>
                        <div style="margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap;">
                            <button class="btn btn-secondary" style="font-size: 0.75rem;" onclick="copyText('${s.id}')">Copy Loadstring</button>
                            <a href="${s.rawUrl}" target="_blank" class="btn btn-secondary" style="font-size: 0.75rem;">View Raw (Tab Baru)</a>
                            <button class="btn" style="font-size: 0.75rem; background-color: var(--danger-color);" onclick="deleteScript(${s.id})">Hapus</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function copyText(id) {
            const text = document.getElementById(`code-${id}`).innerText;
            navigator.clipboard.writeText(text).then(() => {
                showToast("Copy loadstring berhasil!");
            });
        }

        function showToast(msg) {
            const t = document.getElementById("toast");
            t.innerText = msg;
            t.classList.add("show");
            setTimeout(() => t.classList.remove("show"), 2000);
        }

        function deleteScript(id) {
            if (confirm("Hapus script dari FOXRAKA HUB?")) {
                scripts = scripts.filter(s => s.id !== id);
                localStorage.setItem('foxrakahub_final_scripts', JSON.stringify(scripts));
                renderScripts();
            }
        }

        window.addEventListener('hashchange', handleRawRoute);
        handleRawRoute();
        renderScripts();
    </script>
</body>
</html>
